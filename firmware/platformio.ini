; PlatformIO Project Configuration File for Phasor Hardware Node
; Reference: Raspberry Pi Pico (RP2040) + PNI RM3100 3-Axis Magnetometer
; Framework: Arduino / Raspberry Pi Pico Core

[platformio]
default_envs = pico

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200

build_flags =
    -D SERIAL_BAUD=115200
    -D RM3100_I2C_ADDR=0x20
    -D SAMPLE_RATE_HZ=20
    -D STATION_ID="HER-GROUND-PROBE-01"
