services:
  # ============================================================================
  # 1. Python FastAPI Multi-Hazard Scientific Engine & AI Models
  # ============================================================================
  - type: web
    name: phasor-api
    runtime: python
    rootDir: backend/engine
    region: frankfurt # Low-latency to SADC / Africa
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CSHARP_API_URL
        value: https://phasor-0asw.onrender.com
      - key: NOAA_SWPC_RTSW_URL
        value: https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json
      - key: NOAA_MAG_URL
        value: https://services.swpc.noaa.gov/products/solar-wind/mag-1-day.json
      - key: SANSA_HERMANUS_API_URL
        value: https://spaceweather.sansa.org.za/api/geomag/her
      - key: AFRICAS_TALKING_USERNAME
        value: phasor_sadc
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: SAPP_API_TOKEN
        sync: false
      - key: GNSS_SEPTENTRIO_KEY
        sync: false
      - key: SPACE_TRACK_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false

  # ============================================================================
  # 2. C# ASP.NET Core GIC & SignalR Ingestion Engine
  # ============================================================================
  - type: web
    name: phasor-csharp
    runtime: docker
    rootDir: backend/general_backend
    dockerContext: .
    dockerfilePath: Dockerfile
    region: frankfurt
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:5000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: phasor
