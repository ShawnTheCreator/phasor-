<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dashBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="dashPhiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Executive Control Room Dark Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#dashBgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Grid Reticle Line -->
  <line x1="14" y1="32" x2="50" y2="32" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <!-- Modern Technical Phi (Φ) -->
  <ellipse cx="32" cy="32" rx="14" ry="11" fill="none" stroke="url(#dashPhiGrad)" stroke-width="4.5" />
  <line x1="32" y1="9" x2="32" y2="55" stroke="url(#dashPhiGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Live Telemetry Status Dot (Top Right) -->
  <circle cx="51" cy="13" r="4.5" fill="#10b981" />
  <circle cx="51" cy="13" r="7" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />
</svg>
